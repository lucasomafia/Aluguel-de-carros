spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.application.name=aluguel-api
server.port=${PORT:8080}
spring.datasource.url=${BANCO_URL}
spring.datasource.username=${BANCO_USUARIO}
spring.datasource.password=${BANCO_SENHA}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
app.agente.usuario=${AGENTE_USUARIO:}
app.agente.senha=${AGENTE_SENHA:}
app.agente.nome=${AGENTE_NOME:Agente inicial}
app.agente.perfil=${AGENTE_PERFIL:EMPRESA}
